# envoy/rust are not in the terms fixture, so their letter-case is
# register territory (ADR-0004) — either casing is acceptable.
convey = [["gateway", "网关"], ["envoy", "Envoy"], ["rust", "Rust"], ["延迟"], ["熔断"], ["内存"], ["运维"]]
