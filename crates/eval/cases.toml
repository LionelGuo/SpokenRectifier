# 保真评测集 — the fidelity eval suite (工单 10;占位符族工单 24).
#
# One file, zero ceremony: append a `[[case]]` to add coverage. The
# runner (`cargo run -p sr-replay --bin sr-eval`) feeds each transcript
# through the real engine + LLM and machine-checks the output.
#
# Assertion vocabulary — every list optional, checked case-sensitively:
#   preserve  must appear verbatim            → 保留失败 (terms/URLs/numbers)
#   convey    any-of keyword groups           → 丢失 (key ideas)
#   fabricate must NOT appear (noone said it) → 捏造
#   purge     must NOT appear (said, must go) → 残留 (fillers/lead-ins/
#             superseded values/un-normalized numerals)
#   max_once  at most one occurrence          → 残留 (repetition collapse)
#   order     tokens as an in-order subsequence → 过度改写 (light-touch
#             no-rewording guard; short cases only)
#   absorbed  must NOT appear in the body — the placeholder clause
#             absorbed it into a prefill (被吸走的不留正文) → 吸收失败
#   prefill   [{pin,any}] the slot's 【预填】 value must contain one
#             alternative; "" demands an empty value (拿不准不吸)
#             → 吸收失败
#
# Any transcript carrying ‡N‡ additionally asserts the derived
# placeholder contract, no list needed: every sentinel byte-exact and
# exactly as many times as pinned (少号→保留失败, 多号/捏造哨兵→捏造,
# a rewritten shape like ‡01‡ fails both ways) and never decorated
# on both sides (不包裹→保留失败). The 【预填】 block is split off the
# body first (engine semantics), so body probes never see prefill
# values and prefill expectations never read body text.
#
# Coverage families (the id prefix): correction-, supplement-, stutter-,
# mixed-, terms-, numeral-, short-, placeholder-. Length discipline:
# short- cases stay ≤ 15 chars (light-touch), everything else ≥ 60
# (full rectify), so the configurable threshold (default 40) cannot
# silently flip a case.
#
# The terms fixture rides EVERY case's prompt (a fixed dictionary, so a
# developer's local spokenrectifier-terms.txt cannot leak into a run).

terms = ["SpokenRectifier", "EGFR 抑制剂", "RESTful API", "Kubernetes"]

# -- 口头更正 ------------------------------------------------------------

[[case]]
id = "correction-date"
transcript = "嗯我们那个碰头会,时间原来想定在周三上午,哦不对,说错了,是周四上午十点,在302会议室,那个议程嘛,先过一下API的分页设计,然后讨论缓存策略,最后再过一遍上线检查清单,材料我今晚发群里"
preserve = ["302会议室", "API"]
convey = [["周四上午十点", "周四上午10点"], ["分页设计", "分页"], ["缓存策略", "缓存"], ["上线检查清单", "上线清单", "检查清单"], ["材料"], ["群里"]]
