# -- 占位符 ---------------------------------------------------------------

# 空指称吸收:口位词整块吸进预填,正文不再重复这个指称。
[[case]]
id = "placeholder-absorb-file"
transcript = "嗯我想让你打开这个文件‡1‡,就是先看一眼里面的配置项,数据库连接那块重点看一下,超时时间是不是太短了,顺便把缓存的大小也记一下,回头我们一起过一遍,先别动里面的东西"
absorbed = ["这个文件"]
prefill = [{ pin = 1, any = ["这个文件", "该文件", "此文件"] }]
convey = [["配置"], ["数据库"], ["超时"], ["缓存"]]
purge = ["嗯"]

# 专名吸收:ASR 常听不准、用时才想起的名字,吸进预填、正文不重复。
