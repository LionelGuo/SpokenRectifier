[package]
name = "sr-replay"
description = "Scripted session replay driver for the SpokenRectifier engine. Prints the full event stream."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures.workspace = true
serde = { version = "1", features = ["derive"] }
spokenrectifier-config = { path = "../config" }
spokenrectifier-engine = { path = "../engine" }
spokenrectifier-eval = { path = "../eval" }
spokenrectifier-llm = { path = "../llm" }
tokio.workspace = true
toml = "0.8"
