[package]
name = "spokenrectifier-aliyun"
description = "Aliyun qwen3-asr-flash-realtime adapter: the cloud half of the AsrProvider seam (private DashScope realtime WebSocket protocol)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
futures.workspace = true
# Exactly one rustls crypto provider, chosen here: without it the first
# TLS handshake panics ("could not determine the process-level
# CryptoProvider"). ring over aws-lc-rs: no CMake/NASM on Windows builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spokenrectifier-audio = { path = "../audio" }
spokenrectifier-engine = { path = "../engine" }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
