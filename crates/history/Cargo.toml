[package]
name = "spokenrectifier-history"
description = "Local session history: SQLite persistence of every inserted session's raw transcript and rectified text, with layered [history] config, retention sweep, and one-call clear (glossary: 历史与取回)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
spokenrectifier-config = { path = "../config" }
spokenrectifier-engine = { path = "../engine" }
thiserror.workspace = true
toml_edit = "0.22"

[dev-dependencies]
