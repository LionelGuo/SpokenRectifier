[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/audio",
    "crates/config",
    "crates/aliyun",
    "crates/cli",
    "crates/history",
    "crates/insertion",
    "crates/llm",
    "app/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[profile.release]
lto = "thin"
