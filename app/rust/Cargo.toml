[package]
name = "rust_lib_spokenrectifier_app"
description = "flutter_rust_bridge seam: engine commands and the event stream for the Flutter shell, compiled into the library the app loads."
version = "1.0.0"  # the product version — keep in step with ../../app/pubspec.yaml
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
serde = { version = "1", features = ["derive"] }
spokenrectifier-aliyun = { path = "../../crates/aliyun" }
spokenrectifier-asr = { path = "../../crates/asr" }
spokenrectifier-audio = { path = "../../crates/audio" }
spokenrectifier-config = { path = "../../crates/config" }
spokenrectifier-engine = { path = "../../crates/engine" }
spokenrectifier-eval = { path = "../../crates/eval" }
spokenrectifier-history = { path = "../../crates/history" }
spokenrectifier-insertion = { path = "../../crates/insertion" }
spokenrectifier-llm = { path = "../../crates/llm" }
spokenrectifier-tencent = { path = "../../crates/tencent" }
spokenrectifier-volcengine = { path = "../../crates/volcengine" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
