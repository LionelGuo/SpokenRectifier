# SpokenRectifier configuration example.
# - spokenrectifier.toml        committed shared config (all fields optional)
# - spokenrectifier.local.toml  git-ignored; the ONLY place a secret may
#                               live (api_key anywhere, and every *_key /
#                               secret_id under [asr] / [asr.*]), or use the
#                               configured environment variable. Any secret
#                               in the shared file is rejected at startup.
#
# Each file is looked up in the working directory first, then beside the
# executable. Everything below is optional: omit a file (or any field)
# and the built-in defaults apply. Local values win over shared ones,
# field by field.

# Recording session semantics (read by the app's engine assembly).
# passage_mode = true  : long pauses only mark paragraph boundaries; the
#                        session ends on the explicit stop hotkey only.
# passage_mode = false : a pause of session_end_silence_ms auto-ends the
#                        session (short-content mode).
[engine]
passage_mode = true
paragraph_silence_ms = 1200
session_end_silence_ms = 3000
rectify_timeout_ms = 25000                  # hard cap per rectify attempt
                                            #  (each reroll gets a fresh one)

# Cloud ASR: one COMMON segment plus one sub-section per vendor
# (ADR-0009). `provider` picks which sub-section is live; switching it
# never clears another vendor's configuration. With credentials present
# the app streams real transcripts through that vendor's adapter
# (aliyun, volcengine, tencent); without any it falls back to the
# mic-only provider (speech state and silence semantics, no text).
# OpenAI / Azure carry fields but no adapter yet.
#
# The ironclad, extended: any api_key, *_key, or secret_id under [asr]
# or any [asr.*] may live ONLY in spokenrectifier.local.toml — the
# shared file's loader rejects them outright.
[asr]
provider = "aliyun"                        # aliyun | volcengine | tencent | openai | azure
model = "qwen3-asr-flash-realtime"         # the UI's "which model" field;
#                                          #  volcengine's wire fixes model_name
#                                          #  and selects by resource id instead
language = "zh"                            # zh covers mixed zh/en dictation
api_key_env = "DASHSCOPE_API_KEY"          # or api_key in spokenrectifier.local.toml
# base_url = "wss://..."                   # full host override, every vendor

[asr.aliyun]
# workspace_id = "llm-xxxx"                # switch to the workspace-scoped
#                                          #  host ({id}.{region}.maas.aliyuncs.com)
region = "cn-beijing"                      # or "ap-southeast-1" (scoped host only)

[asr.volcengine]
# app_id = "1234567890"                    # console APP ID (X-Api-App-Key)
# access_key = "..."                       # access token — local file only;
#                                          #  or keep it out and the mic-only
#                                          #  fallback applies
resource_id = "volc.seedasr.sauc.duration" # Seed-ASR 2.0 by duration;
#                                          #  .concurrent is the by-concurrency twin

[asr.tencent]                              # realtime engine 16k_zh_en (zh+en);
#                                          #  the China endpoint must be reached
#                                          #  DIRECTLY — via an off-shore proxy
#                                          #  it answers 6001 (add a direct-route
#                                          #  exception for asr.cloud.tencent.com)
# app_id = ""                              # account AppID (URL path)
# secret_id = ""                           # local file only
# secret_key = ""                          # signing key — local file only

[asr.openai]                               # no vendor-specific fields; no adapter

[asr.azure]                                # no adapter (not scheduled)
# region = "eastasia"
# endpoint_id = ""                         # custom speech, optional

# How confirmed text reaches the target window. The target is the window
# you were typing in when the session started (the hotkey flow); editing
# the preview hands focus to SpokenRectifier, and it is handed back
# before the text goes out.
[insertion]
mode = "paste"                # paste: clipboard + Ctrl+V, restored after
                              # typing: per-key SendInput, for apps that
                              # block paste (slower, touches no clipboard)
focus_settle_ms = 50          # wait after re-focusing the target
paste_settle_ms = 250         # wait after Ctrl+V before clipboard restore
typing_delay_ms = 8           # pause between typed characters
                              # Known limit: elevated (administrator) target
                              # windows drop simulated keystrokes (UIPI).

# Local session history: every inserted session's raw transcript and
# rectified text, stored in spokenrectifier-history.db (first writable
# directory of the config search order). Text only — audio never touches
# disk. Long-press the idle orb for the history panel; the tray's
# 清空历史 wipes everything in one click.
[history]
enabled = true              # false = keep-nothing mode: nothing is stored
retention_days = 30         # sessions older than this are swept on launch
                            #  and on every new record

# Hotword dictionary (术语词表): maintained in the settings window's
# 术语 page and stored in the local store database — NOT a file or a
# section here. A legacy spokenrectifier-terms.txt from older versions
# is imported once on first launch, then removed. Providers that can
# bias recognition get the list injected into ASR (Aliyun: the
# transcription corpus; Volcengine: the corpus context hotwords,
# capped to the stream's ~100-token budget); every provider
# additionally gets it as the rectify prompt's term reference,
# verbatim-preserved.

# Scenario library (场景库): maintained in the settings window's
# scenario manager and stored in the local store database — named
# style directives beyond the built-in default register (通用书面),
# NOT a file or a section here. A legacy spokenrectifier-scenarios.toml
# from older versions is imported once on first launch, then removed.
# The tray's 场景 submenu and the recording panel's scenario row switch
# between 默认 and these entries; a pick applies from the next rectify
# on (rerolls included). Style directives shape form and tone only; the
# fidelity rule always outranks them.

# Rectify behavior (ADR-0015/0016): one tier per intensity, the two
# never inheriting from each other. thinking_policy is one of the three
# lowercase strings — "always" (the default: with the zero-example
# rectify prompt, placeholder absorption depends on thinking; a v4-flash
# probe scored 10/10 with, 3/10 without), "placeholders" (thinking only
# when the transcript's census finds a pin), or "off" (saves ~1–2s on
# the light band; prefill goes mostly empty). prefill selects the pinned
# prompt's form: on teaches the ‡N:值‡ inline grammar, off lets marks
# ride the text as-is (ADR-0014). The light-touch tier adds the master
# switch (enabled = false forces full rectify for every length; the
# keys stay stored, just unadopted), the threshold, and the extra
# directive (blank = not injected; injected only on light-touch
# attempts, as its own section after the intensity one).
# [rectify.quick] is the third sub-section, for the held-hotkey
# pass-through (ADR-0020) — see its own note below.
# Every key below is optional: defaults are today's behavior. The
# settings window's 修正 domain edits this section; its first save
# translates the retired legacy [llm] thinking / prefill /
# light_touch_max_chars keys (still read today) into this shape, layer
# by layer, and strips them.
[rectify.full]
thinking_policy = "always"              # always | placeholders | off
prefill = true

[rectify.light_touch]
enabled = true
max_chars = 40                          # strictly below: light-touch; at or above: full
thinking_policy = "always"
prefill = true
# extra_directive = "短句尽量保留口语节奏" # light-touch attempts only (ADR-0016)

# Quick mode (快速模式, ADR-0020): holding the main flow hotkey past the
# fixed threshold upgrades the session — release ends recording, the
# window never waits for a confirmation, no edit phase, and no
# placeholder may be pinned into it. The master switch is OFF by
# default, so every existing gesture keeps today's meaning. A quick
# session always takes the light-touch intensity section — never the
# character threshold, never the light-touch master switch — and swaps
# its own extra directive in for the light-touch one; thinking is forced
# off (with no thinking fields configured the request carries no
# thinking key at all, leaving the endpoint on its own default). With
# rectify = false the raw transcript is pasted straight through and no
# model is called. A blank extra_directive = not injected. A failed
# rectify or insertion falls back to the normal preview.
[rectify.quick]
enabled = false                         # off: no hold upgrades a session
rectify = true                          # off: paste the raw transcript as-is
# extra_directive = "短句尽量保留口语节奏" # quick-mode attempts only, replaces the light-touch directive

# Rectify LLM: any OpenAI-compatible endpoint, bring your own key.
# One model per mode: light-touch vs full rectify is decided by
# [rectify.light_touch] and changes only the prompt, never the model.
# Configuring a model/base_url/api_key without a resolvable key is an
# error at startup (never a silent fallback to the demo script); an
# unknown vendor or an empty model/base_url is rejected too.
[llm]
vendor = "deepseek"                     # deepseek | volcengine | qwen | openai | custom
base_url = "https://api.deepseek.com"   # everything before /chat/completions
model = "deepseek-flash"

# Each vendor keeps its OWN api_key pair under its sub-section (ADR-0011):
# a key authenticates exactly one vendor, so switching vendors never
# carries (or loses) another vendor's key. api_key lives only in
# spokenrectifier.local.toml; api_key_env names a fallback environment
# variable and defaults per vendor (DEEPSEEK_API_KEY / ARK_API_KEY /
# DASHSCOPE_API_KEY / OPENAI_API_KEY) when the sub-section omits it.
# [llm.deepseek]
# api_key = "sk-..."        # spokenrectifier.local.toml only
# [llm.volcengine]
# api_key = "ark-..."       # spokenrectifier.local.toml only

# Swapping the model is three fields plus the new vendor's own key, e.g.
# Volcengine Ark:
#   [llm]
#   vendor = "volcengine"
#   base_url = "https://ark.cn-beijing.volces.com/api/v3"
#   model = "doubao-seed-2.0-lite"
#   [llm.volcengine]        # in spokenrectifier.local.toml
#   api_key = "ark-..."

# The custom chip (ADR-0018): an unadapted OpenAI-compatible endpoint.
# vendor = "custom" switches the ACTIVE endpoint to the [llm] common
# segment's values; this sub-section is the RESTORE CACHE (so switching
# away and back loses nothing) plus the thinking dialect and the custom
# request-body overlay. While another vendor is active the slot sits
# stored, just unadopted. thinking_dialect is one of the four adapted
# shapes (deepseek / volcengine / qwen / openai, default openai) — the
# FIELD SHAPE the thinking policy is written into, not when to think.
# There is no conventional environment variable: the key comes from
# api_key here (local file only) or a hand-written api_key_env.
# The overlay merges AFTER the dialect fields and BEFORE [llm.extra_body]
# (which keeps the last word); it exists only while custom is active.
# [llm.custom]
# base_url = "https://my-gateway.example"
# model = "my-model"
# thinking_dialect = "openai"
# [llm.custom.extra_body]
# top_p = 0.9
# thinking = { type = "enabled" }       # may override the dialect's fields

# Escape hatch: merged into the request body last, so it can override
# anything this config models.
# [llm.extra_body]
# top_p = 0.9
