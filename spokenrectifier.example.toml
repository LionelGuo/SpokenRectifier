# SpokenRectifier configuration example.
# - spokenrectifier.toml        committed shared config (all fields optional)
# - spokenrectifier.local.toml  git-ignored; the ONLY place an api_key may
#                               live, or use the configured environment variable.
#
# Everything below is optional: omit a file (or any field) and the built-in
# defaults apply. Local values win over shared ones, field by field.

# Recording session semantics (read by the app's engine assembly).
# passage_mode = true  : long pauses only mark paragraph boundaries; the
#                        session ends on the explicit stop hotkey only.
# passage_mode = false : a pause of session_end_silence_ms auto-ends the
#                        session (short-content mode).
[engine]
passage_mode = true
paragraph_silence_ms = 1200
session_end_silence_ms = 3000

# Cloud ASR provider (Aliyun qwen3-asr-flash-realtime, pay-as-you-go).
# Schema lands with the ASR adapter work.
[asr.aliyun]
api_key = ""

# Rectify LLM: any OpenAI-compatible endpoint, bring your own key.
# One model per mode: light-touch vs full rectify is decided by length
# (below light_touch_max_chars takes light-touch) and changes only the
# prompt, never the model. Rewrite wants thinking OFF by default (latency
# and over-rectify risk); flip `thinking` to true if you want it.
[llm]
thinking = false
light_touch_max_chars = 40
vendor = "deepseek"                     # deepseek | volcengine | qwen | openai
base_url = "https://api.deepseek.com"   # everything before /chat/completions
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"        # or api_key in spokenrectifier.local.toml

# Swapping the model is three fields, e.g. Volcengine Ark:
#   [llm]
#   vendor = "volcengine"
#   base_url = "https://ark.cn-beijing.volces.com/api/v3"
#   model = "doubao-seed-2.0-lite"
#   api_key_env = "ARK_API_KEY"

# Escape hatch: merged into the request body last, so it can override
# anything this config models.
# [llm.extra_body]
# top_p = 0.9
