# SpokenRectifier local configuration example.
# Copy to spokenrectifier.local.toml and fill in your own keys.
# *.local.toml is git-ignored: keys never enter version control.
#
# NOTE: the schema is a placeholder; it is finalized with the
# configuration system work (styles, model tiers, retention).

# Cloud ASR provider (Aliyun qwen3-asr-flash-realtime, pay-as-you-go).
[asr.aliyun]
api_key = ""

# Rectify LLM: any OpenAI-compatible endpoint, bring your own key.
# Default tier: DeepSeek V4-Flash with thinking disabled.
[llm]
api_key = ""
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-flash"
